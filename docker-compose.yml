services:
  # ────────────────────────────────────────────────────────────
  # MariaDB 11 — DB principal del proyecto
  # ────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: labux-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-labux_root_2026}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-labux}
      MARIADB_USER: ${MYSQL_USER:-labux}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-labux_secret}
      # TZ opcional
      TZ: ${TZ:-America/Argentina/Catamarca}
    volumes:
      - mariadb_data:/var/lib/mysql
      # Init SQL se ejecuta solo la primera vez que el volume está vacío
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
      # Config custom opcional (descomentar si se agrega my.cnf)
      # - ./docker/mariadb/conf/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - labux
    # Límite de memoria opcional para dev
    # mem_limit: 512m

  # ────────────────────────────────────────────────────────────
  # Next.js 15 App (lab-ux)
  # ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labux-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # DB principal — usada por src/lib/db.ts (mysql2/promise)
      DATABASE_URL: ${DATABASE_URL:-mysql://${MYSQL_USER:-labux}:${MYSQL_PASSWORD:-labux_secret}@mariadb:3306/${MYSQL_DATABASE:-labux}}
      # Compat legacy (deprecated, ver .env.example)
      MONGODB_URI: ${MONGODB_URI:-}
      # Backend externo — si existe API local reemplazar por http://app:3000/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://backend.lab-ux.site}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      TZ: ${TZ:-America/Argentina/Catamarca}
    env_file:
      - .env
      - .env.local
    networks:
      - labux
    # Para desarrollo con hot-reload descomentar y usar Dockerfile.dev o override:
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    #   - /app/.next
    # command: npm run dev

  # ────────────────────────────────────────────────────────────
  # Adminer (o phpMyAdmin) — solo con profile "tools"
  # Uso: docker compose --profile tools up -d
  # URL: http://localhost:8080  (Sistema: MariaDB, Servidor: mariadb, Usuario/Clave según .env)
  # ────────────────────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1
    container_name: labux-adminer
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    networks:
      - labux
    profiles:
      - tools

networks:
  labux:
    name: labux-network
    driver: bridge

volumes:
  mariadb_data:
    name: labux-mariadb-data
